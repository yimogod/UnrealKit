<title>UnrealKit Icon</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #F0F2F5;
    --surface: #FFFFFF;
    --navy: #1B263B;
    --blue: #4A9FE8;
    --text: #1B263B;
    --sub: #6B7A8D;
    --border: #DDE2EA;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0E1520;
      --surface: #161F30;
      --text: #D8E0EC;
      --sub: #7A8A9D;
      --border: #253047;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1520;
    --surface: #161F30;
    --text: #D8E0EC;
    --sub: #7A8A9D;
    --border: #253047;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-inline: 16px;
    padding-block: 40px;
    min-height: 100%;
  }
  h1 {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--sub);
    margin-bottom: 32px;
  }
  .grid {
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
    align-items: flex-end;
  }
  .cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--sub);
  }
  /* The icon — inline SVG, multiple sizes */
  .icon-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon-wrap.dark-bg {
    background: #2C3A55;
    border-color: #2C3A55;
  }

  /* Checkerboard for the dark-bg cells to show transparency */
  .swatch-row {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    align-items: flex-end;
    margin-top: 40px;
  }
  .section-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--sub);
    letter-spacing: .05em;
    text-transform: uppercase;
    width: 100%;
    margin-bottom: 4px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }

  .palette {
    display: flex; gap: 12px; flex-wrap: wrap; margin-top: 40px;
  }
  .swatch {
    width: 56px;
    display: flex; flex-direction: column; gap: 6px; align-items: center;
  }
  .swatch-color {
    width: 56px; height: 56px; border-radius: 8px;
    border: 1px solid var(--border);
  }
  .swatch-name {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px; color: var(--sub); text-align: center;
  }
</style>
