[UnrealKit.ProjectSettings]
SettingsVersion=2
UnrealProjectName=
LocalWorkingDirectory=

; 控制台指令通道。Android 与 Win64 都走引擎自带 Web Remote Control 的 HTTP 服务
; （默认端口 RemoteControlHttpPort）。Android 需改引擎两处 PlatformAllowList 加入
; Android：WebRemoteControl 模块与 WebSocketNetworking 模块（属用户改引擎的职责，
; UnrealKit 侧不负责）。这些字段是可版本化的工程配置，GUI 与 CLI 共用。
RemoteControlHttpPort=30010
RemoteControlObjectPath=/Script/Engine.Default__KismetSystemLibrary
RemoteControlFunctionName=ExecuteConsoleCommand
RemoteControlCommandParameter=Command

DefaultCaptureTag=Default
DefaultExportDirectory=Saved/Exports

; 平台配置按平台分节，同一工程可同时配置多个平台。
; 此处的值是组织级默认值；「本工程支持哪些平台」由工程自己的
; Config/DefaultGame.ini 声明——只有那里出现的平台节才算已配置。
[UnrealKit.Platform.Android]
PackageName=
Activity=
GameRootTemplate=/sdcard/Android/data/{PackageName}/files/UnrealGame/{UnrealProjectName}/{UnrealProjectName}
AdbPath=
FtpPath=

[UnrealKit.Platform.Win64]
Executable=
WorkingDirectory=
FtpPath=

; FTP 构建服务器。主机 / 端口 / 凭据跨平台共享，各平台的下载父目录
; 由各自 profile 的 FtpPath 指定。Password 是敏感信息：界面掩码，日志不落。
[UnrealKit.Ftp]
Host=
Port=21
Username=
Password=

; 启动参数预设分组：组内互斥（Exclusive 最多选一个）或同组共存（Coexist）。
; 值是 "模式:成员1,成员2"。内置默认只有 Render 互斥组（OpenGL / Vulkan 二选一）。
[UnrealKit.LaunchPresetGroups]
Render=Exclusive:Render.OpenGL,Render.Vulkan
Trace=Exclusive:Trace.Client_All,Trace.Client_Default,Trace.Client_Network,Trace.Client_Memory
