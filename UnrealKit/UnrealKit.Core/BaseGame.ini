[UnrealKit.ProjectSettings]
SettingsVersion=2
UnrealProjectName=
LocalWorkingDirectory=
RemoteControlHttpPort=30010
RemoteControlObjectPath=/Script/Engine.Default__KismetSystemLibrary
RemoteControlFunctionName=ExecuteConsoleCommand
RemoteControlCommandParameter=Command
DefaultCaptureTag=Default
DefaultExportDirectory=Saved/Exports

; 平台配置按平台分节，同一工程可同时配置多个平台。
; 此处的值是组织级默认值；「本工程支持哪些平台」由工程自己的
; Config/DefaultGame.ini 声明——只有那里出现的平台节才算已配置。
[UnrealKit.Platform.Android]
PackageName=
Activity=
GameRootTemplate=/sdcard/Android/data/{PackageName}/files/UnrealGame/{UnrealProjectName}/{UnrealProjectName}
AdbPath=
FtpPath=

[UnrealKit.Platform.Win64]
Executable=
WorkingDirectory=
FtpPath=

; FTP 构建服务器。主机 / 端口 / 凭据跨平台共享，各平台的下载父目录
; 由各自 profile 的 FtpPath 指定。Password 是敏感信息：界面掩码，日志不落。
[UnrealKit.Ftp]
Host=
Port=21
Username=
Password=
